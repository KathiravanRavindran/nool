<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Nool</title>
    <link rel="stylesheet" href="Auth.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 80px auto 20px auto;
            padding: 0 20px;
            display: none; /* Hidden until auth is checked */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .user-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f9fafb;
            border-radius: 4px;
            margin-bottom: 1rem;
            border: 1px solid #e5e7eb;
        }

        .user-info {
            margin-bottom: 1rem;
        }

        .user-info h3 {
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .user-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .approve-btn {
            width: 100%;
            padding: 0.6rem;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
        }

        .approve-btn:hover {
            background: #15803d;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">NOOL ADMIN</a>
        <div class="nav-links" id="adminNavLinks">
            <a href="#" onclick="logout()" style="color: #ef4444; font-weight: bold;">Logout</a>
        </div>
    </nav>

    <!-- Admin Dashboard Section -->
    <div class="admin-container" id="adminDashboardSection">
        <div class="header">
            <h2>Pending Registrations</h2>
            <button onclick="fetchPendingUsers()" style="padding: 8px 16px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc;">Refresh List</button>
        </div>

        <div class="users-grid" id="usersGrid">
            <p>Loading pending users...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        const dashboardSection = document.getElementById('adminDashboardSection');

        // Check login status on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const authData = await requireAdmin();
            if (authData) {
                // User is authenticated and is an admin
                dashboardSection.style.display = 'block';
                fetchPendingUsers();
            }
        });

        // Fetch Pending Users from Supabase
        async function fetchPendingUsers() {
            const grid = document.getElementById('usersGrid');
            grid.innerHTML = '<p>Fetching registrations from database...</p>';

            try {
                const client = window.supabase || supabase;
                const { data, error } = await client
                    .from('users_profile')
                    .select('*')
                    .eq('is_approved', false);

                if (error) throw error;

                if (!data || data.length === 0) {
                    grid.innerHTML = '<p>No pending registrations at the moment.</p>';
                    return;
                }

                grid.innerHTML = '';
                data.forEach(user => {
                    grid.innerHTML += `
                        <div class="user-card" id="user-${user.id}">
                            <a href="${user.id_card_url}" target="_blank">
                                <img src="${user.id_card_url}" alt="ID Card">
                            </a>
                            <div class="user-info">
                                <h3>${user.full_name}</h3>
                                <p><strong>Email:</strong> ${user.email}</p>
                                <p><strong>Reg No:</strong> ${user.register_no}</p>
                                <p><strong>Dept:</strong> ${user.department}</p>
                                <p><strong>Year:</strong> ${user.year}</p>
                            </div>
                            <button class="approve-btn" onclick="approveUser('${user.id}')">Approve User</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Fetch Error:", err);
                grid.innerHTML = '<p style="color: red;">Failed to load users from database.</p>';
            }
        }

        // Approve User Logic
        async function approveUser(userId) {
            if(!confirm('Are you sure you want to approve this user?')) return;

            const btn = document.querySelector(`#user-${userId} .approve-btn`);
            btn.disabled = true;
            btn.innerText = 'Approving...';

            try {
                const client = window.supabase || supabase;
                const { error } = await client
                    .from('users_profile')
                    .update({ is_approved: true })
                    .eq('id', userId);

                if (error) throw error;

                document.getElementById(`user-${userId}`).remove();
                alert("User approved successfully!");
            } catch (err) {
                console.error("Approve Error:", err);
                alert("Failed to approve user.");
                btn.disabled = false;
                btn.innerText = 'Approve User';
            }
        }
    </script>
</body>
</html>
