<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Nool Community</title>
    <link rel="stylesheet" href="Auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="login-card register-card">
            <div class="login-header">
                <h2>Create Account</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Join our Nool community</p>
            </div>

            <form id="registerForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="full_name" placeholder="Name" required>
                    </div>

                    <div class="form-group">
                        <label>Register Number</label>
                        <input type="text" name="register_no" placeholder="5104XXXXXXXX" required>
                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <select name="department" class="custom-select" required>
                            <option value="">Select Dept</option>
                            <option value="CSE-AIML">CSE(AIML)</option>
                            <option value="AIDS">AIDS</option>
                            <option value="CSE">CSE</option>
                            <option value="IT">IT</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="CIVIL">CIVIL</option>
                            <option value="BIOTECH">BIOTECH</option>
                            <option value="AGRI">AGRI</option>
                            <option value="CHEMICAL">CHEMICAL</option>
                            <option value="MECH">MECH</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Year</label>
                        <select name="year" class="custom-select" required>
                            <option value="1">I Year</option>
                            <option value="2">II Year</option>
                            <option value="3">III Year</option>
                            <option value="4">IV Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="name@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="Create a password" required minlength="6">
                    </div>
                </div>

                <div class="form-group">
                    <label>Upload ID Card (Image)</label>
                    <input type="file" id="idCardInput" accept="image/*" class="file-input" required>
                    <small id="uploadStatus" style="display: block; margin-top: 5px; color: var(--primary-color);"></small>
                </div>

                <button type="submit" id="submitBtn" class="login-btn">Register Now</button>
            </form>

            <div class="register-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <!-- Supabase and Auth Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const API_KEY = IMGBB_API_KEY; // From config.js
        const registerForm = document.getElementById('registerForm');
        const uploadStatus = document.getElementById('uploadStatus');
        const submitBtn = document.getElementById('submitBtn');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('idCardInput');
            const file = fileInput.files[0];
            
            if (!file) return alert("Please select an ID card image.");

            // Disable button and show status
            submitBtn.disabled = true;
            submitBtn.innerText = "Uploading Image...";
            uploadStatus.innerText = "Uploading ID to server...";

            try {
                // 1. Upload to ImgBB
                const imgFormData = new FormData();
                imgFormData.append('image', file);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                    method: 'POST',
                    body: imgFormData
                });
                const imgData = await response.json();

                if (!imgData.success) throw new Error("ImgBB upload failed");
                const idCardUrl = imgData.data.url;
                uploadStatus.innerText = "Upload successful! Creating account...";
                
                // 2. Extract Data from Form
                const formData = new FormData(registerForm);
                const data = Object.fromEntries(formData.entries());
                
                // 3. Supabase Auth Sign Up
                const { data: authData, error: authError } = await window.supabase.auth.signUp({
                    email: data.email,
                    password: data.password
                });

                if (authError) throw authError;

                // 4. Insert into users_profile table
                uploadStatus.innerText = "Saving profile details...";
                const { error: dbError } = await window.supabase
                    .from('users_profile')
                    .insert([
                        {
                            id: authData.user.id,
                            full_name: data.full_name,
                            register_no: data.register_no,
                            department: data.department,
                            year: parseInt(data.year),
                            email: data.email,
                            id_card_url: idCardUrl,
                            is_approved: false,
                            is_admin: false
                        }
                    ]);
                
                if (dbError) {
                    if (dbError.code === '23503') throw new Error("This email is already registered. Please login.");
                    if (dbError.code === '42501') throw new Error("Database security policy blocked the registration.");
                    throw dbError;
                }

                alert("Registration Successful! Please wait for admin approval before logging in.");
                window.location.href = 'index.html';
                
            } catch (error) {
                console.error("Registration Error:", error);
                alert("Registration Error:\n" + (error.message || JSON.stringify(error)));
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Register Now";
                uploadStatus.innerText = "";
            }
        });
    </script>
</body>
</html>
