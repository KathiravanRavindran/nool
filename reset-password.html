<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Nool Community</title>
    <link rel="stylesheet" href="Auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Set New Password</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">
                    Please enter your new password below.
                </p>
            </div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required minlength="6">
                </div>

                <button type="submit" class="login-btn">Update Password</button>
            </form>
            
            <div class="register-link" style="margin-top: 1.5rem;">
                Remembered your password? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <!-- Supabase Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const submitBtn = resetPasswordForm.querySelector('.login-btn');

        // Verify that the user came from a recovery link
        document.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash;
            if (!hash || !hash.includes('type=recovery')) {
                alert("Invalid or expired password reset link.");
                window.location.href = 'login.html';
            }
        });

        resetPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Updating...";

            try {
                const client = window.supabase || supabase;
                
                // Update the user's password securely
                const { error } = await client.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                alert("Password updated successfully! You can now log in with your new password.");
                // Redirect back to login page
                window.location.hash = '';
                window.location.href = 'login.html';
            } catch (err) {
                console.error("Password Update Error:", err);
                alert("Failed to update password: " + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Update Password";
            }
        });
    </script>
</body>
</html>
