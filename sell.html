<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Book - Book</title>
    <link rel="stylesheet" href="Auth.css">
    <style>
        .sell-card {
            max-width: 700px;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .price-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        #imagePreview {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 10px;
            border-radius: var(--radius);
            display: none;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">BOOK</a>
        <div class="nav-links">
            <a href="buy.html" style="font-weight: 600;">Marketplace</a>
        </div>
    </nav>
    <div class="auth-container">
        <div class="login-card sell-card">
            <div class="login-header">
                <h2>List Your Book</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Fill in the details to help juniors find your book</p>
            </div>

            <form id="sellForm">
                <!-- Academic Details Section -->
                <div class="form-group">
                    <label>Book Full Name</label>
                    <input type="text" name="bookName" placeholder="e.g. Engineering Mathematics - II" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Regulation Year</label>
                        <select name="regulation" class="custom-select" required>
                            <option value="2021">2021 Regulation</option>
                            <option value="2024">2024 Regulation</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subject Code/Name</label>
                        <input type="text" name="subject" placeholder="e.g. MA3251" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Publication / Author</label>
                    <input type="text" name="publication" placeholder="e.g. Lakshmi Publications / Dr. Venkataraman" required>
                </div>

                <!-- Price & Condition Section -->
                <div class="price-group">
                    <div class="form-group">
                        <label>Original Price (₹)</label>
                        <input type="number" name="originalPrice" placeholder="Price you paid" required>
                    </div>
                    <div class="form-group">
                        <label>Selling Price (₹)</label>
                        <input type="number" name="sellingPrice" placeholder="Your offer" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Book Condition</label>
                    <select name="condition" class="custom-select" required>
                        <option value="new">New (Unused)</option>
                        <option value="like-new">Like New (No marks)</option>
                        <option value="good">Good (Minor marks)</option>
                        <option value="acceptable">Acceptable (Worn but readable)</option>
                    </select>
                </div>

                <!-- Media & Contact Section -->
                <div class="form-group">
                    <label>Upload Book Photo</label>
                    <input type="file" id="bookImage" accept="image/*" class="file-input" required>
                    <img id="imagePreview" alt="Preview">
                    <small id="uploadStatus" style="display: block; margin-top: 5px; color: var(--primary-color);"></small>
                </div>

                <div class="form-group">
                    <label>Contact Info (WhatsApp Number)</label>
                    <input type="tel" name="contact" placeholder="91XXXXXXXXXX" required>
                </div>

                <button type="submit" id="submitBtn" class="login-btn">Post Advertisement</button>
            </form>

        </div>
    </div>

    <!-- Supabase and Auth Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Use the API key from config.js
        const API_KEY = IMGBB_API_KEY;
        const sellForm = document.getElementById('sellForm');
        const imageInput = document.getElementById('bookImage');
        const preview = document.getElementById('imagePreview');
        const status = document.getElementById('uploadStatus');
        const submitBtn = document.getElementById('submitBtn');
        let currentUser = null;

        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('edit');

        // Check Auth
        document.addEventListener('DOMContentLoaded', async () => {
            const authData = await requireAuth();
            if (authData) currentUser = authData.session.user;

            if (editId) {
                document.querySelector('.login-header h2').innerText = 'Edit Book Listing';
                submitBtn.innerText = 'Update Listing';
                const client = window.supabase || supabase;
                const { data: bookData, error } = await client.from('books').select('*').eq('id', editId).single();
                
                if (bookData) {
                    sellForm.bookName.value = bookData.book_name;
                    sellForm.regulation.value = bookData.regulation;
                    sellForm.subject.value = bookData.subject;
                    sellForm.publication.value = bookData.publication;
                    sellForm.originalPrice.value = bookData.original_price;
                    sellForm.sellingPrice.value = bookData.selling_price;
                    sellForm.condition.value = bookData.condition;
                    sellForm.contact.value = bookData.contact;
                    preview.src = bookData.image_url;
                    preview.style.display = 'block';
                    imageInput.required = false; // Not required when editing
                }
            }
        });

        // Image Preview Logic
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // Form Submission with ImgBB Integration
        sellForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = editId ? "Updating Listing..." : "Processing Listing...";
            
            let imageUrl = preview.src; // Default to existing if no new file is chosen
            const file = imageInput.files[0];
            
            if (!file && !editId) {
                alert("Please upload a photo of the book.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Post Advertisement";
                return;
            }

            if (file) {
                status.innerText = "Uploading image to Book servers...";
                const imgFormData = new FormData();
                imgFormData.append('image', file);
                const bookName = sellForm.bookName.value.replace(/\s+/g, '-').toLowerCase();
                imgFormData.append('name', `book-book-${bookName}`);

                try {
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                        method: 'POST',
                        body: imgFormData
                    });

                    const imgResult = await response.json();
                    if (imgResult.success) {
                        imageUrl = imgResult.data.url;
                    } else {
                        throw new Error("Image upload failed");
                    }
                } catch (error) {
                    console.error("Error:", error);
                    alert("Something went wrong with the image upload: " + (error.message || "Please try again."));
                    submitBtn.disabled = false;
                    submitBtn.innerText = editId ? "Update Listing" : "Post Advertisement";
                    return;
                }
            }

            try {
                // Final Data Object
                const formData = new FormData(sellForm);
                const updatePayload = {
                    book_name: formData.get('bookName'),
                    regulation: formData.get('regulation'),
                    subject: formData.get('subject'),
                    publication: formData.get('publication'),
                    original_price: parseFloat(formData.get('originalPrice')),
                    selling_price: parseFloat(formData.get('sellingPrice')),
                    condition: formData.get('condition'),
                    image_url: imageUrl,
                    contact: formData.get('contact')
                };

                status.innerText = "Saving book details...";
                const client = window.supabase || supabase;
                
                if (editId) {
                    const { data: updatedData, error: dbError } = await client
                        .from('books')
                        .update(updatePayload)
                        .eq('id', editId)
                        .select();
                    if (dbError) throw dbError;
                    
                    if (!updatedData || updatedData.length === 0) {
                        alert("Update blocked by Database Security (RLS). Please ensure you ran the SQL commands in Supabase SQL Editor!");
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Update Listing";
                        return;
                    }
                    
                    alert("Book updated successfully!");
                    window.location.href = 'buy.html';
                } else {
                    updatePayload.seller_id = currentUser.id;
                    const { error: dbError } = await client
                        .from('books')
                        .insert([updatePayload]);
                    if (dbError) throw dbError;

                    alert("Book listed successfully!");
                    window.location.href = 'index.html'; 
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong: " + (error.message || "Please try again."));
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = editId ? "Update Listing" : "Post Advertisement";
            }
        });
    </script>
</body>
</html>
